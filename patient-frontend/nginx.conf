server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # ---- API: same-origin proxy to the Spring Cloud api-gateway (no CORS, single entry point).
  # All request headers (incl. W3C `traceparent` and Authorization) are forwarded, so traces start at the browser request.
  location ~ ^/(api|auth|api-docs)/ {
    proxy_pass http://api-gateway:4004;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # gateway liveness, used by the "System" page
  location = /gateway-health {
    proxy_pass http://api-gateway:4004/actuator/health;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA fallback
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
