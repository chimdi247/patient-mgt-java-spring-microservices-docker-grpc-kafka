# =============================================================================
# Patient Management platform - everything with one command:
#
#     docker compose up -d --build
#
#   App            frontend http://localhost:3000     api-gateway http://localhost:4004
#   Messaging      Kafka UI http://localhost:8090     Mailpit (alert e-mails) http://localhost:8025
#   Observability  Grafana  http://localhost:3001     Prometheus :9090  Loki :3100  Tempo :3200
#   Perf tests     tests/run.sh smoke                  (see tests/README.md)
#
# Login: admin@example.com / password123   (seeded by docker/postgres/02-seed-users.sql)
# =============================================================================

x-otel-env: &otel-env
  # OpenTelemetry Java agent (attached in every service Dockerfile) -> OTel Collector -> Tempo / Loki / Prometheus
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_TRACES_EXPORTER: otlp
  OTEL_METRICS_EXPORTER: otlp
  OTEL_LOGS_EXPORTER: otlp
  OTEL_METRIC_EXPORT_INTERVAL: "15000"
  OTEL_PROPAGATORS: tracecontext,baggage       # W3C trace context: HTTP, gRPC metadata, Kafka headers
  OTEL_RESOURCE_ATTRIBUTES: deployment.environment=docker,service.version=0.0.1

x-db-env: &db-env
  SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
  SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
  SPRING_JPA_HIBERNATE_DDL_AUTO: none          # schema comes from docker/postgres/*.sql
  SPRING_SQL_INIT_MODE: never                  # ...and so do the seed rows (the services' data.sql is not used)

services:
  # ===========================================================================
  # DATA & MESSAGING
  # ===========================================================================
  postgres:
    image: postgres:17-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    command: ["postgres", "-c", "max_connections=100"]
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # 01-create-databases-and-tables.sql, 02-seed-admin-user.sql (run once, on an empty volume)
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h 127.0.0.1 forces TCP, so it only passes after the init scripts finished
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER} -d patient_db"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    mem_limit: 512m
    networks: [patient-net]

  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    restart: unless-stopped
    ports:
      - "29092:29092"                          # for clients running on the host (IDE, kcat, ...)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    mem_limit: 1536m
    networks: [patient-net]

  kafka-init:
    image: apache/kafka:3.9.0
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    entrypoint: ["/bin/sh", "/scripts/create-topics.sh"]
    volumes:
      - ./docker/kafka:/scripts:ro
    networks: [patient-net]

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: patient-platform
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"
    mem_limit: 512m
    networks: [patient-net]

  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"                            # web UI - Grafana alert e-mails land here
      - "1025:1025"                            # SMTP
    environment:
      MP_MAX_MESSAGES: "5000"
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    mem_limit: 128m
    networks: [patient-net]

  # ===========================================================================
  # MICROSERVICES  (only the api-gateway is published; the others are reachable inside the network)
  # ===========================================================================
  billing-service:
    build: ./billing-service
    container_name: billing-service
    restart: unless-stopped
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: billing-service
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:4001/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    depends_on:
      otel-collector:
        condition: service_started
    mem_limit: 1536m
    cpus: 1.0
    networks: [patient-net]

  auth-service:
    build: ./auth-service
    container_name: auth-service
    restart: unless-stopped
    environment:
      <<: [*otel-env, *db-env]
      OTEL_SERVICE_NAME: auth-service
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/auth_db
      JWT_SECRET: ${JWT_SECRET}
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:4005/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
    mem_limit: 1536m
    cpus: 1.0
    networks: [patient-net]

  patient-service:
    build: ./patient-service
    container_name: patient-service
    restart: unless-stopped
    environment:
      <<: [*otel-env, *db-env]
      OTEL_SERVICE_NAME: patient-service
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/patient_db
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      BILLING_SERVICE_ADDRESS: billing-service
      BILLING_SERVICE_GRPC_PORT: "9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:4000/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      billing-service:
        condition: service_healthy
      otel-collector:
        condition: service_started
    mem_limit: 1536m
    cpus: 1.0
    networks: [patient-net]

  analytics-service:
    build: ./analytics-service
    container_name: analytics-service
    restart: unless-stopped
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: analytics-service
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:4002/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
    mem_limit: 1536m
    cpus: 1.0
    networks: [patient-net]

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "4004:4004"
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: api-gateway
      SPRING_PROFILES_ACTIVE: prod                 # routes use docker service names (application-prod.yml)
      AUTH_SERVICE_URL: http://auth-service:4005
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:4004/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    depends_on:
      auth-service:
        condition: service_healthy
      patient-service:
        condition: service_healthy
      otel-collector:
        condition: service_started
    mem_limit: 1536m
    cpus: 1.0
    networks: [patient-net]

  # ===========================================================================
  # FRONTEND
  # ===========================================================================
  frontend:
    # React + shadcn/ui, served by nginx. /api/* and /auth/* are proxied to the api-gateway (same origin, no CORS).
    build:
      context: ./patient-frontend
      args:
        VITE_GRAFANA_URL: ${VITE_GRAFANA_URL}
        VITE_KAFKA_UI_URL: ${VITE_KAFKA_UI_URL}
        VITE_MAILPIT_URL: ${VITE_MAILPIT_URL}
    container_name: frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      api-gateway:
        condition: service_healthy
    mem_limit: 128m
    cpus: 0.5
    networks: [patient-net]

  # ===========================================================================
  # OBSERVABILITY   (configuration lives in ./observability)
  # ===========================================================================
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.130.0
    container_name: otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    ports:
      - "4317:4317"                            # OTLP gRPC
      - "4318:4318"                            # OTLP HTTP
    volumes:
      - ./observability/otel-collector/otel-collector-config.yml:/etc/otelcol/config.yaml:ro
    depends_on:
      - tempo
      - loki
    mem_limit: 512m
    networks: [patient-net]

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-remote-write-receiver     # Tempo metrics-generator (span metrics / service graph)
      - --web.enable-lifecycle
      - --enable-feature=exemplar-storage      # metric -> trace links
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    mem_limit: 1536m
    networks: [patient-net]

  loki:
    image: grafana/loki:3.5.0
    container_name: loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki-config.yml"]
    ports:
      - "3100:3100"
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    mem_limit: 768m
    networks: [patient-net]

  tempo-init:
    # Tempo runs as uid 10001 and needs a writable data directory
    image: busybox:1.36
    container_name: tempo-init
    user: root
    command: ["chown", "-R", "10001:10001", "/var/tempo"]
    volumes:
      - tempo-data:/var/tempo
    restart: "no"
    networks: [patient-net]

  tempo:
    image: grafana/tempo:2.8.2
    container_name: tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yml"]
    ports:
      - "3200:3200"
    volumes:
      - ./observability/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo
    depends_on:
      tempo-init:
        condition: service_completed_successfully
      prometheus:
        condition: service_started
    mem_limit: 768m
    networks: [patient-net]

  grafana:
    image: grafana/grafana:12.1.0
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      # read by grafana.ini ($__env{...}) and by the alerting provisioning files
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS}
      SMTP_STARTTLS_POLICY: ${SMTP_STARTTLS_POLICY}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO}
    volumes:
      - ./observability/grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
      - tempo
    mem_limit: 768m
    networks: [patient-net]

  cadvisor:
    # per-container CPU / memory / network metrics
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    command:
      - --docker_only=true
      - --housekeeping_interval=15s
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.service
    ports:
      - "8085:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    mem_limit: 512m
    networks: [patient-net]

  node-exporter:
    # node (host / docker VM) CPU, memory, disk, network metrics
    image: prom/node-exporter:v1.9.1
    container_name: node-exporter
    restart: unless-stopped
    pid: host
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /:/host:ro
    mem_limit: 128m
    networks: [patient-net]

  blackbox-exporter:
    # probes /actuator/health of every service -> uptime / availability SLI
    image: prom/blackbox-exporter:v0.27.0
    container_name: blackbox-exporter
    restart: unless-stopped
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    volumes:
      - ./observability/prometheus/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    mem_limit: 128m
    networks: [patient-net]

  # ===========================================================================
  # DATA-LAYER EXPORTERS  (-> PostgreSQL / Kafka dashboards)
  # ===========================================================================
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.17.1
    container_name: postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_URI: postgres:5432/postgres?sslmode=disable
      DATA_SOURCE_USER: ${POSTGRES_USER}
      DATA_SOURCE_PASS: ${POSTGRES_PASSWORD}
    command:
      - --auto-discover-databases                 # per-table stats for auth_db and patient_db
      - --exclude-databases=template0,template1
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 128m
    networks: [patient-net]

  kafka-exporter:
    # topics, partitions, offsets, ISR and consumer-group lag
    image: danielqsj/kafka-exporter:v1.9.0
    container_name: kafka-exporter
    restart: unless-stopped
    command:
      - --kafka.server=kafka:9092
      - --topic.filter=.*
      - --group.filter=.*
    depends_on:
      kafka:
        condition: service_healthy
    mem_limit: 128m
    networks: [patient-net]

  # ===========================================================================
  # PERFORMANCE TESTS (opt-in, profile `tests`):  tests/run.sh <smoke|load|stress|spike|soak|...>
  # ===========================================================================
  k6:
    image: grafana/k6:1.1.0
    container_name: k6
    profiles: ["tests"]
    user: root                                  # so --summary-export can write into ./tests/results
    entrypoint: ["k6"]
    environment:
      BASE_URL: http://api-gateway:4004
      K6_OUT: experimental-prometheus-rw
      K6_PROMETHEUS_RW_SERVER_URL: http://prometheus:9090/api/v1/write
      K6_PROMETHEUS_RW_PUSH_INTERVAL: 5s
      K6_PROMETHEUS_RW_TREND_STATS: avg,min,max,p(90),p(95),p(99)
      K6_PROMETHEUS_RW_TREND_AS_NATIVE_HISTOGRAM: "false"
      K6_PROMETHEUS_RW_STALE_MARKERS: "true"
    volumes:
      - ./tests/k6:/scripts:ro
      - ./tests/results:/results                # --summary-export JSON files
    working_dir: /scripts
    depends_on:
      api-gateway:
        condition: service_healthy
      prometheus:
        condition: service_started
    networks: [patient-net]

volumes:
  postgres-data:
  prometheus-data:
  loki-data:
  tempo-data:
  grafana-data:

networks:
  patient-net:
    driver: bridge
