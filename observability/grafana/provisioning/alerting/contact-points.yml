apiVersion: 1
contactPoints:
  - orgId: 1
    name: Patient Management Ops (email)
    receivers:
      - uid: pm-email
        type: email
        settings:
          # comma / semicolon separated; taken from ALERT_EMAIL_TO in .env (SMTP itself is set in grafana.ini)
          addresses: $ALERT_EMAIL_TO
          singleEmail: false
        disableResolveMessage: false
